version: 2

models:
  - name: dim_book
    description: "One row per King book. Open Library is the source of truth."
    columns:
      - { name: book_sk,     tests: [unique, not_null] }
      - { name: ol_work_id,  tests: [unique, not_null] }
  - name: dim_film
    description: "One row per adaptation. TMDB credits filtered to King."
    columns:
      - { name: film_sk, tests: [unique, not_null] }
  - name: dim_character
    description: "Recurring + signature characters."
    columns:
      - { name: character_sk,  tests: [unique, not_null] }
      - { name: wikidata_qid,  tests: [unique, not_null] }
  - name: fct_appearance
    description: "Many-to-many between characters and books (Wikidata)."
  - name: fct_cameo
    description: "King's on-screen appearances."

semantic_models:
  - name: castle_rock_corpus
    label: Castle Rock corpus
    model: ref('dim_book')
    description: "The book-and-corpus model that Cortex Analyst answers natural-language questions against."
    measures:
      - name: book_count
        agg: count
        expr: book_sk
    dimensions:
      - { name: published_year, type: time, type_params: { time_granularity: year } }
      - { name: pseudonym }
      - { name: series }
